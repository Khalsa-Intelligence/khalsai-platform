<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Why Guru Course — Gravesend | Anonymous Sangat Feedback</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 60%, #080c14 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.12);
      --input-bg: rgba(15, 23, 42, 0.75);
      --input-border: rgba(255, 255, 255, 0.15);
      --primary: #f59e0b;
      --primary-hover: #d97706;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #ef4444;
      --danger-hover: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.25rem 0.75rem;
    }

    .container {
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2rem 1.5rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
      position: relative;
    }

    @media (min-width: 640px) {
      .container { padding: 2.5rem 2.25rem; }
    }

    .admin-trigger {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .admin-trigger:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.18); }

    .header { text-align: center; margin-bottom: 2rem; margin-top: 0.5rem; }
    .header h1 {
      font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fef08a 0%, #f59e0b 50%, #38bdf8 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
    }
    .header p { color: var(--text-muted); font-size: 0.9rem; font-weight: 500; }

    .form-group { margin-bottom: 1.5rem; }
    label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.6rem; color: #e2e8f0; line-height: 1.4; }
    .required::after { content: " *"; color: #f87171; }

    input[type="text"], input[type="password"], select, textarea {
      width: 100%; background: var(--input-bg); border: 1px solid var(--input-border);
      border-radius: 12px; padding: 0.85rem 1rem; color: var(--text-main);
      font-size: 16px; /* Prevents iOS auto-zoom */
      outline: none; transition: all 0.2s ease;
      min-height: 48px;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
    }
    select option { background: #0f172a; color: #f8fafc; }
    textarea { resize: vertical; min-height: 90px; line-height: 1.5; }

    /* Star Rating Grid */
    .rating-container { display: flex; gap: 0.5rem; }
    .star-btn {
      background: var(--input-bg); border: 1px solid var(--input-border);
      border-radius: 12px; height: 48px; font-size: 1rem; font-weight: 600;
      cursor: pointer; color: var(--text-muted); flex: 1; text-align: center;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s ease;
    }
    .star-btn.active {
      background: rgba(245, 158, 11, 0.2);
      border-color: var(--primary);
      color: #fbbf24;
      transform: scale(1.02);
    }
    .star-btn:active { transform: scale(0.96); }

    /* Radio Pills Grid */
    .radio-group { display: flex; gap: 0.6rem; flex-direction: row; }
    @media (max-width: 480px) {
      .radio-group { flex-direction: column; }
    }
    .radio-option { flex: 1; }
    .radio-option input { display: none; }
    .radio-option label {
      display: flex; align-items: center; justify-content: center;
      background: var(--input-bg); border: 1px solid var(--input-border);
      border-radius: 12px; min-height: 48px; padding: 0.5rem 0.75rem;
      cursor: pointer; text-align: center; font-size: 0.9rem; font-weight: 500;
      color: var(--text-muted); transition: all 0.15s ease;
    }
    .radio-option input:checked + label {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--accent);
      color: #7dd3fc;
      font-weight: 600;
    }

    .submit-btn {
      width: 100%; background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #ffffff; border: none; border-radius: 12px; min-height: 52px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.35);
      transition: all 0.2s ease; margin-top: 0.5rem;
    }
    .submit-btn:hover { opacity: 0.95; transform: translateY(-1px); }
    .submit-btn:active { transform: translateY(0); }

    .alert { padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; display: none; font-size: 0.9rem; line-height: 1.4; text-align: center; }
    .alert-success { background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.4); color: #4ade80; }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px);
      display: none; justify-content: center; align-items: center; z-index: 100; padding: 1rem;
    }
    .modal-content {
      background: #0f172a; border: 1px solid var(--card-border);
      border-radius: 20px; width: 100%; max-width: 680px; max-height: 85vh;
      overflow-y: auto; padding: 1.5rem; box-shadow: 0 25px 50px rgba(0,0,0,0.8);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .modal-header h2 { font-size: 1.25rem; color: #f8fafc; }
    .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; padding: 0.25rem; }

    .data-card {
      background: rgba(255, 255, 255, 0.04); border: 1px solid var(--card-border);
      border-radius: 12px; padding: 1rem; margin-bottom: 0.75rem;
    }
    .data-card-header { display: flex; justify-content: space-between; color: var(--primary); font-weight: 600; font-size: 0.9rem; margin-bottom: 0.4rem; }
    .data-card p { font-size: 0.85rem; color: #cbd5e1; margin-top: 0.3rem; line-height: 1.4; }
    
    .data-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .delete-card-btn {
      background: transparent;
      border: 1px solid var(--danger);
      color: #f87171;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .delete-card-btn:hover {
      background: var(--danger);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <button class="admin-trigger" onclick="openAdminModal()">🔒 Admin</button>
    <div class="header">
      <h1>Why Guru Course — Gravesend</h1>
      <p>Sangat Feedback & Insights</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="feedbackForm">
      <div class="form-group">
        <label for="sessionName" class="required">1. Which session did you attend?</label>
        <select id="sessionName" required>
          <option value="" disabled>Select a session...</option>
          <option value="Session 1: Sat 19th Sep 2026" data-date="2026-09-19">Session 1: Sat 19th Sep 2026</option>
          <option value="Session 2: Sat 3rd Oct 2026" data-date="2026-10-03">Session 2: Sat 3rd Oct 2026</option>
          <option value="Session 3: Sat 17th Oct 2026" data-date="2026-10-17">Session 3: Sat 17th Oct 2026</option>
          <option value="Session 4: Sat 31st Oct 2026" data-date="2026-10-31">Session 4: Sat 31st Oct 2026</option>
          <option value="Session 5: Sat 14th Nov 2026" data-date="2026-11-14">Session 5: Sat 14th Nov 2026</option>
          <option value="Session 6: Sat 28th Nov 2026" data-date="2026-11-28">Session 6: Sat 28th Nov 2026</option>
          <option value="Session 7: Sat 12th Dec 2026" data-date="2026-12-12">Session 7: Sat 12th Dec 2026</option>
          <option value="Session 8: Sat 9th Jan 2027" data-date="2027-01-09">Session 8: Sat 9th Jan 2027</option>
          <option value="Session 9: Sat 23rd Jan 2027" data-date="2027-01-23">Session 9: Sat 23rd Jan 2027</option>
          <option value="Session 10: Sat 6th Feb 2027" data-date="2027-02-06">Session 10: Sat 6th Feb 2027</option>
          <option value="Session 11: Sat 20th Feb 2027" data-date="2027-02-20">Session 11: Sat 20th Feb 2027</option>
          <option value="Session 12: Sat 6th Mar 2027" data-date="2027-03-06">Session 12: Sat 6th Mar 2027</option>
          <option value="Session 13: Sat 20th Mar 2027" data-date="2027-03-20">Session 13: Sat 20th Mar 2027</option>
          <option value="Session 14: Sat 3rd Apr 2027" data-date="2027-04-03">Session 14: Sat 3rd Apr 2027</option>
        </select>
      </div>

      <div class="form-group">
        <label class="required">2. How would you rate this session?</label>
        <div class="rating-container" id="ratingContainer">
          <button type="button" class="star-btn" data-value="1">★ 1</button>
          <button type="button" class="star-btn" data-value="2">★ 2</button>
          <button type="button" class="star-btn" data-value="3">★ 3</button>
          <button type="button" class="star-btn" data-value="4">★ 4</button>
          <button type="button" class="star-btn" data-value="5">★ 5</button>
        </div>
        <input type="hidden" id="rating" required>
      </div>

      <div class="form-group">
        <label class="required">3. Did you learn something new today?</label>
        <div class="radio-group">
          <div class="radio-option">
            <input type="radio" id="learntYes" name="learnt_new" value="Yes" required>
            <label for="learntYes">Yes</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="learntNo" name="learnt_new" value="No">
            <label for="learntNo">No</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="learntPartial" name="learnt_new" value="A little bit">
            <label for="learntPartial">A little bit</label>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="touchedComment">4. What touched your heart or inspired you today?</label>
        <textarea id="touchedComment" placeholder="Share what inspired you..."></textarea>
      </div>

      <div class="form-group">
        <label for="encouragementComment">5. Any feedback for the team?</label>
        <textarea id="encouragementComment" placeholder="Share your thoughts..."></textarea>
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">Submit Feedback</button>
    </form>
  </div>

  <!-- Admin Modal -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Admin View — Submissions</h2>
        <button class="close-btn" onclick="closeAdminModal()">✕</button>
      </div>

      <div id="authSection">
        <div class="form-group">
          <label for="adminPass">Enter Admin Password:</label>
          <input type="password" id="adminPass" placeholder="••••••••">
        </div>
        <button class="submit-btn" onclick="fetchFeedbackData()">View Feedback</button>
      </div>

      <div id="dataList" style="margin-top: 1rem;"></div>
    </div>
  </div>

  <script>
    function autoSelectCurrentSession() {
      const selectElem = document.getElementById('sessionName');
      const options = selectElem.querySelectorAll('option[data-date]');
      const now = new Date();
      now.setHours(23, 59, 59, 999);

      let selectedVal = options[0].value;

      for (const option of options) {
        const sessionDate = new Date(option.getAttribute('data-date') + 'T23:59:59');
        if (now >= sessionDate) {
          selectedVal = option.value;
        } else {
          break;
        }
      }

      selectElem.value = selectedVal;
    }

    autoSelectCurrentSession();

    const starBtns = document.querySelectorAll('.star-btn');
    const ratingInput = document.getElementById('rating');

    starBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const val = btn.getAttribute('data-value');
        ratingInput.value = val;
        starBtns.forEach(b => b.classList.toggle('active', parseInt(b.getAttribute('data-value')) <= parseInt(val)));
      });
    });

    document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!ratingInput.value) return alert('Please select a rating (1-5 stars)');

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Submitting...';

      const payload = {
        session_name: document.getElementById('sessionName').value,
        rating: parseInt(ratingInput.value),
        learnt_new: document.querySelector('input[name="learnt_new"]:checked').value,
        touched_comment: document.getElementById('touchedComment').value,
        encouragement_comment: document.getElementById('encouragementComment').value
      };

      try {
        const res = await fetch('/api/feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (res.ok && data.success) {
          document.getElementById('alertBox').innerHTML = 'Waheguru Ji Ka Khalsa, Waheguru Ji Ki Fateh!<br>Thank you for your feedback.';
          document.getElementById('alertBox').className = 'alert alert-success';
          document.getElementById('alertBox').style.display = 'block';
          e.target.reset();
          starBtns.forEach(b => b.classList.remove('active'));
          ratingInput.value = '';
          autoSelectCurrentSession();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          alert('Error: ' + (data.error || 'Failed to submit feedback. Check server log.'));
        }
      } catch (err) {
        alert('API Connection Error: ' + err.message + '\n\nMake sure /api/feedback route is created in Cloudflare Functions.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit Feedback';
      }
    });

    function openAdminModal() { document.getElementById('adminModal').style.display = 'flex'; }
    function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; }

    async function fetchFeedbackData() {
      const pass = document.getElementById('adminPass').value;
      const res = await fetch('/api/admin-feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pass })
      });
      const data = await res.json();

      if (!res.ok) return alert(data.error || 'Failed to authenticate');

      document.getElementById('authSection').style.display = 'none';
      renderFeedbackList(data.data);
    }

    function renderFeedbackList(submissions) {
      const container = document.getElementById('dataList');
      container.innerHTML = `<h3 style="font-size:1rem; color:var(--accent); margin-bottom: 0.75rem;">Total Submissions: ${submissions.length}</h3>`;

      submissions.forEach(item => {
        const card = document.createElement('div');
        card.className = 'data-card';
        card.innerHTML = `
          <div class="data-card-header">
            <span>${escapeHtml(item.session_name || '')}</span>
            <span>Rating: ${'★'.repeat(item.rating || 0)}</span>
          </div>
          <p><strong>Learnt something new:</strong> ${escapeHtml(item.learnt_new || '')}</p>
          ${item.touched_comment ? `<p><strong>Inspired by:</strong> ${escapeHtml(item.touched_comment)}</p>` : ''}
          ${item.encouragement_comment ? `<p><strong>Feedback:</strong> ${escapeHtml(item.encouragement_comment)}</p>` : ''}
          
          <div class="data-card-footer">
            <span style="font-size:0.75rem; color:#64748b;">Submitted: ${item.created_at || 'Just now'}</span>
            <button class="delete-card-btn" onclick="deleteFeedbackRecord(${item.id})">🗑️ Delete</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function deleteFeedbackRecord(recordId) {
      const pass = document.getElementById('adminPass').value;
      if (!confirm("Are you sure you want to delete this feedback entry?")) return;

      try {
        const res = await fetch('/api/delete-feedback', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: Number(recordId), password: pass })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          // Re-fetch list to refresh view
          fetchFeedbackData();
        } else {
          alert(data.error || 'Failed to delete entry.');
        }
      } catch (err) {
        alert('Error connecting to server: ' + err.message);
      }
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
